name: Deploy

# Deploy de uma imagem já publicada pelo CI (que já rodou build, testes, cobertura e Sonar).
#  - Automático: após o CI/CD da `main` terminar com sucesso, publica o commit em homolog.
#    Só roda se a variável do repositório AUTO_DEPLOY for "true" (as credenciais do AWS Academy expiram em ~4h,
#    então o automático fica desligado até o ambiente estar de pé e os secrets atualizados).
#  - Manual: workflow_dispatch (homolog ou prod, com a tag desejada).
on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente"
        required: true
        default: "homolog"
        type: choice
        options: [ homolog, prod ]
      image_tag:
        description: "Tag da imagem no GHCR (ex.: sha-1a2b3c4 ou latest)"
        required: true
        default: "latest"

jobs:
  deploy:
    name: Deploy Kubernetes (${{ inputs.environment || 'homolog' }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY == 'true')
    environment: ${{ inputs.environment || 'homolog' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Credenciais AWS (Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: azure/setup-kubectl@v4

      - name: Deploy
        env:
          IMAGE: ghcr.io/tech-challenge-oficina-mecanica-soat/oficina-os-service:${{ inputs.image_tag || format('sha-{0}', substr(github.event.workflow_run.head_sha, 0, 7)) }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: ./scripts/deploy-k8s.sh ${{ inputs.environment || 'homolog' }}
