openapi: 3.0.3
info:
  title: OS Service API
  description: |
    Gerencia o ciclo de vida da Ordem de Serviço.
    Atua como **orquestrador da Saga Pattern**.
  version: 1.0.0
  contact:
    name: Rafael (Papel A)

servers:
  - url: https://api-{env}.oficina.example.com/os
    variables:
      env:
        default: homolog
        enum: [homolog, prod]

paths:
  /ordens-servico:
    post:
      summary: Abrir nova OS (dispara Saga)
      description: |
        Fluxo Saga iniciado aqui:
        1. Valida cliente e veículo (chamada REST ao Cadastros)
        2. Cria OS com status `AguardandoDiagnostico`
        3. Publica evento `os.criada` → Execução Service pega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbrirOSRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OS'
        '400':
          description: Dados inválidos
        '404':
          description: Cliente ou veículo não encontrado
        '403':
          description: Cliente inativo

    get:
      summary: Listar OSes
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusOS'
        - name: clienteId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OS' }

  /ordens-servico/{id}:
    get:
      summary: Detalhes da OS (consumido por Billing e Execução)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSDetalhada'

  /ordens-servico/{id}/cancelar:
    post:
      summary: Cancelar OS
      description: Publica `os.cancelada`; compensação disparada nos outros serviços
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: OS cancelada

  /ordens-servico/{id}/historico:
    get:
      summary: Histórico de mudanças de status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricoStatus'

components:
  schemas:
    StatusOS:
      type: string
      enum:
        - AguardandoDiagnostico
        - EmDiagnostico
        - AguardandoAprovacao
        - Aprovada
        - EmReparo
        - AguardandoPagamento
        - Concluida
        - Cancelada
        - PendenteCobranca

    AbrirOSRequest:
      type: object
      required: [cpf, placa, defeitoRelatado]
      properties:
        cpf: { type: string }
        placa: { type: string }
        defeitoRelatado: { type: string }

    OS:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusOS' }
        clienteId: { type: string, format: uuid }
        veiculoId: { type: string, format: uuid }
        defeitoRelatado: { type: string }
        criadaEm: { type: string, format: date-time }
        atualizadaEm: { type: string, format: date-time }

    OSDetalhada:
      allOf:
        - $ref: '#/components/schemas/OS'
        - type: object
          properties:
            diagnosticoId: { type: string, format: uuid, nullable: true }
            orcamentoId: { type: string, format: uuid, nullable: true }
            pagamentoId: { type: string, format: uuid, nullable: true }

    HistoricoStatus:
      type: object
      properties:
        statusAnterior: { $ref: '#/components/schemas/StatusOS' }
        statusNovo: { $ref: '#/components/schemas/StatusOS' }
        mudouEm: { type: string, format: date-time }
        motivo: { type: string }
