# SonarCloud — o CI usa o dotnet-sonarscanner (ver .github/workflows/ci.yml); este arquivo documenta as exclusões.
# sonar.projectKey e sonar.organization vêm das variáveis do repositório SONAR_PROJECT_KEY e SONAR_ORGANIZATION.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/Migrations/**,**/obj/**,**/bin/**
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,tests/**
sonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml
