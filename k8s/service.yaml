apiVersion: v1
kind: Service
metadata:
  name: oficina-os-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: orquestrador-saga
    app.kubernetes.io/part-of: oficina-mecanica
  annotations:
    # Mesmo padrão do Service da API (Fase 3). O hostname do NLB é publicado em
    # /oficina/{env}/services/os/api-url para Billing e Execução descobrirem.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: os-service
  ports:
    - port: 80
      targetPort: 5000
      name: http
